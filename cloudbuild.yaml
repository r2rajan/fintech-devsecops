# Secure Supply Chain — Cloud Build Pipeline (SLSA Level 2)
#
# SLSA L2 satisfied:
#   ✓ Hosted managed build service (Cloud Build)
#   ✓ Build triggered from version-controlled source (GitHub)
#   ✓ SLSA provenance generated and signed by Cloud Build
#
# Three security gates before production:
#   1. Unit tests must pass
#   2. No CRITICAL vulnerabilities in the container image
#   3. OPA policy: container must not run as root

steps:

  # ── Gate 1: Unit tests ────────────────────────────────────────────────
  - id: unit-tests
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        cd services/payment-risk
        pip install -q -r requirements.txt
        python -c "from main import _score, Transaction; \
          r = _score(Transaction(amount_gbp=9000, merchant_category='crypto', country_code='NG', channel='online')); \
          assert r['risk_level'] == 'CRITICAL', f'Expected CRITICAL got {r[\"risk_level\"]}'; \
          print('✓ Risk scoring test passed — CRITICAL correctly identified')"

  # ── Build payment risk app ─────────────────────────────────────────────
  - id: build-app
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/fintech-apps/payment-risk-service:$SHORT_SHA
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/fintech-apps/payment-risk-service:latest
      - --label=build.id=$BUILD_ID
      - --label=build.commit=$SHORT_SHA
      - services/payment-risk/
    waitFor: [unit-tests]

  # ── Push to Artifact Registry ──────────────────────────────────────────
  - id: push-app
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/fintech-apps/payment-risk-service
    waitFor: [build-app]

  # ── Capture immutable digest ───────────────────────────────────────────
  - id: get-digest
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker inspect \
          --format='{{index .RepoDigests 0}}' \
          us-central1-docker.pkg.dev/$PROJECT_ID/fintech-apps/payment-risk-service:$SHORT_SHA \
          | tee /workspace/digest.txt
        echo "Pinned digest: $(cat /workspace/digest.txt)"
    waitFor: [push-app]

  # ── Gate 2: Vulnerability scan ─────────────────────────────────────────
  - id: check-vulnerabilities
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        img=$(cat /workspace/digest.txt)
        echo "Scanning: $img"
        for i in $(seq 1 20); do
          critical=$(gcloud artifacts docker images describe "$img" \
            --show-package-vulnerability \
            --format="value(package_vulnerability_summary.vulnerability_counts.CRITICAL)" \
            --project=$PROJECT_ID 2>/dev/null || echo "")
          [ -n "$critical" ] && break
          echo "Waiting for scan result... ($i/20)"; sleep 15
        done
        echo "Critical CVEs found: ${critical:-0}"
        if [ "${critical:-0}" -gt "0" ]; then
          echo "✗ BLOCKED — ${critical} critical vulnerabilities. Fix before deploying."
          exit 1
        fi
        echo "✓ Vulnerability scan passed — 0 critical CVEs"
    waitFor: [get-digest]

  # ── Gate 3: OPA policy validation ─────────────────────────────────────
  - id: policy-check
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        img=$(cat /workspace/digest.txt)
        curl -sL -o /usr/local/bin/opa \
          https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static \
          && chmod +x /usr/local/bin/opa
        printf '{"image":"%s","commit_sha":"%s","build_id":"%s","runs_as_root":false,"has_secrets_in_env":false}' \
          "$img" "$SHORT_SHA" "$BUILD_ID" > /tmp/input.json
        opa eval \
          --data policies/supply_chain.rego \
          --input /tmp/input.json \
          --fail-defined \
          "data.supply_chain.deny" \
        && echo "✓ OPA policy passed" \
        || { echo "✗ BLOCKED — OPA policy violation"; exit 1; }
    waitFor: [check-vulnerabilities]

  # ── Deploy payment risk app ────────────────────────────────────────────
  - id: deploy-app
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        img=$(cat /workspace/digest.txt)
        gcloud run deploy payment-risk-service \
          --project=$PROJECT_ID \
          --region=us-central1 \
          --image="$img" \
          --allow-unauthenticated \
          --set-env-vars="PROJECT_ID=$PROJECT_ID,BUILD_ID=$BUILD_ID,COMMIT_SHA=$SHORT_SHA,IMAGE_TAG=$SHORT_SHA" \
          --min-instances=0 \
          --max-instances=5 \
          --memory=256Mi \
          --cpu=1
        url=$(gcloud run services describe payment-risk-service \
          --project=$PROJECT_ID --region=us-central1 \
          --format="value(status.url)")
        echo "✓ Payment Risk App: $url"
        echo "$url" > /workspace/app_url.txt
    waitFor: [policy-check]

  # ── Build dashboard ────────────────────────────────────────────────────
  - id: build-dashboard
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/fintech-apps/supply-chain-dashboard:latest
      - dashboard/
    waitFor: [unit-tests]

  - id: push-dashboard
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/fintech-apps/supply-chain-dashboard:latest
    waitFor: [build-dashboard]

  # ── Deploy dashboard ───────────────────────────────────────────────────
  - id: deploy-dashboard
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        app_url=$(cat /workspace/app_url.txt 2>/dev/null || echo "")
        gcloud run deploy supply-chain-dashboard \
          --project=$PROJECT_ID \
          --region=us-central1 \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/fintech-apps/supply-chain-dashboard:latest \
          --allow-unauthenticated \
          --set-env-vars="PROJECT_ID=$PROJECT_ID,APP_URL=$app_url" \
          --min-instances=0 \
          --max-instances=2 \
          --memory=256Mi \
          --cpu=1
        dash_url=$(gcloud run services describe supply-chain-dashboard \
          --project=$PROJECT_ID --region=us-central1 \
          --format="value(status.url)")
        echo "✓ Dashboard: $dash_url"
    waitFor: [deploy-app, push-dashboard]

options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED

tags:
  - supply-chain
